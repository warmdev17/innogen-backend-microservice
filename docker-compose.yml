version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: innogen-postgres
    environment:
      POSTGRES_DB: innogen
      POSTGRES_USER: innogen
      POSTGRES_PASSWORD: innogen
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: innogen-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  piston:
    image: ghcr.io/engineer-man/piston:latest
    container_name: innogen-piston
    privileged: true
    restart: unless-stopped
    ports:
      - "2000:2000"
    volumes:
      - pistondata:/piston

volumes:
  pgdata:
  redisdata:
  pistondata:
